# Template: certificate paths must match actual issuance. Enable only when files exist.
server {
    listen 80;
    server_name creator.meedoo.fun;
    location /.well-known/acme-challenge/ { root /var/www/meedoo-acme; }
    location / { return 301 https://creator.meedoo.fun$request_uri; }
}
server {
    listen 443 ssl;
    client_max_body_size 16m; # JSON/base64 brand attachment uploads, app validates 10 MB files
    server_name creator.meedoo.fun;
    ssl_certificate /etc/letsencrypt/live/creator.meedoo.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/creator.meedoo.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Avoid persisting OAuth codes/state in proxy access logs.
    location ~ ^/auth/(lark|google)/callback$ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
